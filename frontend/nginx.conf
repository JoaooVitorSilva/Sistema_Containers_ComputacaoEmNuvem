# Nginx do contêiner "web": entrega o front-end e é o API GATEWAY.
# Cada caminho /api/... vai para o microsserviço dono daquele recurso.
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: resolve "produtos", "clientes" e "vendas" a cada
    # requisição. Assim o gateway continua no ar mesmo se um serviço cair.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $svc_produtos http://produtos:3000;
    set $svc_clientes http://clientes:3000;
    set $svc_vendas   http://vendas:3000;

    proxy_http_version 1.1;
    proxy_set_header   Host            $host;
    proxy_set_header   X-Real-IP       $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout    15s;

    # Rotas internas: só os microsserviços usam, pela rede interna
    location ~ ^/api/produtos/(reservar|devolver) { return 403; }
    location ~ ^/api/vendas/resumo-clientes      { return 403; }

    # Roteamento: um microsserviço por recurso
    location /api/produtos  { rewrite ^/api/(.*)$ /$1 break; proxy_pass $svc_produtos; }
    location /api/clientes  { rewrite ^/api/(.*)$ /$1 break; proxy_pass $svc_clientes; }
    location /api/vendas    { rewrite ^/api/(.*)$ /$1 break; proxy_pass $svc_vendas; }
    location /api/dashboard { rewrite ^/api/(.*)$ /$1 break; proxy_pass $svc_vendas; }

    # Saúde de cada serviço (tela "Arquitetura")
    location = /api/health/produtos { rewrite ^ /health break; proxy_pass $svc_produtos; }
    location = /api/health/clientes { rewrite ^ /health break; proxy_pass $svc_clientes; }
    location = /api/health/vendas   { rewrite ^ /health break; proxy_pass $svc_vendas; }

    # Serviço fora do ar -> resposta JSON que o front entende
    error_page 502 503 504 = @indisponivel;
    location @indisponivel {
        default_type application/json;
        return 503 '{"erro":"Microsserviço indisponível no momento"}';
    }

    # Telas: o navegador sempre confere se há versão nova (evita front antigo em cache)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
